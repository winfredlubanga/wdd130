<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact White Water Rafting for questions, booking information, and customer support. Send us a message or reach us by phone or email.">
    <meta name="author" content="Your Full Name">
    <title>Contact Us | WWR Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="WWR Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html" class="active">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <>
        <section class="company-info">
            <h1>Contact Us</h1>

            <p><strong>Address:</strong> 123 River Canyon Road, Rapids Town, CO 80400</p>
            <p><strong>Phone:</strong> (555) 987-6543</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <h2>Find Us</h2>

            <!-- Google Map Embed (REMEMBER: remove inline style="border:0") -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!..." width="600" height="450"
                allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Sarah, Lead Guide">
                <figcaption>Sarah — Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Mike, Safety Supervisor">
                <figcaption>Mike — Safety Supervisor</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Emily, Reservations Manager">
                <figcaption>Emily — Reservations Manager</figcaption>
            </figure>
        </section>
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">

                <label for="fullname">Your Name</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

                <p><strong>Purpose of Message:</strong></p>

                <label>
                    <input type="radio" name="purpose" value="general" required>
                    General Inquiry
                </label><br>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label><br>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label><br>

                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>

                <label>
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit" class="submit-btn">Send Message</button>

            </form>
        </section>
        </main>

        <footer>
            <p>&copy; 2025 WWR Rafting Company | Winfred Lubanga</p>
            <nav class="socialmedia">
                <a href="#"><img src="images/facebook-icon.png" alt="Facebook social icon"></a>
                <a href="#"><img src="images/linkedin-icon.png" alt="LinkedIn social icon"></a>
                <a href="#"><img src="images/instagram-icon.png" alt="Instagram social icon"></a>
            </nav>
        </footer>
</body>

</html>
